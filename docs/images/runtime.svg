<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Parley at run time: the UI thread, the session and the network thread</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .col-title { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .col-sub { font-size: 11px; fill: #57606a; }
      .row-label { font-size: 11px; font-weight: 600; fill: #57606a; letter-spacing: 0.04em; }
      .chip { fill: #ffffff; stroke: #d0d7de; }
      .chip-title { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #1f2328; }
      .chip-sub { font-size: 10.5px; fill: #57606a; }
      .box-title { font-size: 12px; font-weight: 600; fill: #1f2328; }
      .box-sub { font-size: 11px; fill: #57606a; }
      .link { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .note { font-size: 12px; fill: #57606a; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="429" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="42" font-size="20" font-weight="600" fill="#1f2328">One connection at run time</text>

  <!-- UI thread -->
  <rect x="32" y="64" width="180" height="230" rx="10" fill="#ecfdf8" stroke="#6cc9b4"/>
  <text x="46" y="88" class="col-title">UI thread</text>
  <text x="46" y="104" class="col-sub">egui, parley-ui-egui</text>
  <rect x="44" y="122" width="156" height="44" rx="8" class="chip"/>
  <text x="56" y="140" class="box-title">draws the Screen</text>
  <text x="56" y="156" class="box-sub">every frame</text>
  <rect x="44" y="222" width="156" height="44" rx="8" class="chip"/>
  <text x="56" y="240" class="box-title">PC key → keymap</text>
  <text x="56" y="256" class="box-sub">→ 5250 key, or a macro</text>

  <!-- Session -->
  <rect x="248" y="64" width="464" height="230" rx="10" fill="#fff8e6" stroke="#e0b44c"/>
  <text x="264" y="88" class="col-title">Session</text>
  <text x="326" y="88" class="col-sub">parley-core, sans-I/O, shared as Arc&lt;Mutex&lt;Session&gt;&gt;</text>
  <text x="264" y="114" class="row-label">HOST → SCREEN: receive(bytes)</text>
  <text x="264" y="214" class="row-label">KEYS → HOST: key(..), take_outbound()</text>

  <g>
    <rect x="264" y="122" width="94" height="44" rx="8" class="chip"/>
    <text x="274" y="140" class="chip-title">screen</text>
    <text x="274" y="156" class="chip-sub">buffer, fields</text>
    <rect x="376" y="122" width="94" height="44" rx="8" class="chip"/>
    <text x="386" y="140" class="chip-title">datastream</text>
    <text x="386" y="156" class="chip-sub">commands</text>
    <rect x="488" y="122" width="94" height="44" rx="8" class="chip"/>
    <text x="498" y="140" class="chip-title">record</text>
    <text x="498" y="156" class="chip-sub">5250 header</text>
    <rect x="600" y="122" width="94" height="44" rx="8" class="chip"/>
    <text x="610" y="140" class="chip-title">telnet</text>
    <text x="610" y="156" class="chip-sub">options, EOR</text>

    <line x1="488" y1="144" x2="472" y2="144" class="link" marker-end="url(#arrow)"/>
    <line x1="600" y1="144" x2="584" y2="144" class="link" marker-end="url(#arrow)"/>
    <line x1="376" y1="144" x2="360" y2="144" class="link" marker-end="url(#arrow)"/>

    <rect x="264" y="222" width="94" height="44" rx="8" class="chip"/>
    <text x="274" y="240" class="chip-title">input</text>
    <text x="274" y="256" class="chip-sub">field rules</text>
    <rect x="376" y="222" width="94" height="44" rx="8" class="chip"/>
    <text x="386" y="240" class="chip-title">reply</text>
    <text x="386" y="256" class="chip-sub">AID + fields</text>
    <rect x="488" y="222" width="94" height="44" rx="8" class="chip"/>
    <text x="498" y="240" class="chip-title">telnet</text>
    <text x="498" y="256" class="chip-sub">escape, EOR</text>
    <rect x="600" y="222" width="94" height="44" rx="8" class="chip"/>
    <text x="610" y="240" class="chip-title">outbound</text>
    <text x="610" y="256" class="chip-sub">bytes queued</text>

    <line x1="358" y1="244" x2="374" y2="244" class="link" marker-end="url(#arrow)"/>
    <line x1="470" y1="244" x2="486" y2="244" class="link" marker-end="url(#arrow)"/>
    <line x1="582" y1="244" x2="598" y2="244" class="link" marker-end="url(#arrow)"/>
  </g>

  <!-- arrows between columns -->
  <line x1="264" y1="144" x2="202" y2="144" class="link" marker-end="url(#arrow)"/>
  <line x1="200" y1="244" x2="262" y2="244" class="link" marker-end="url(#arrow)"/>
  <line x1="760" y1="144" x2="696" y2="144" class="link" marker-end="url(#arrow)"/>
  <line x1="694" y1="244" x2="758" y2="244" class="link" marker-end="url(#arrow)"/>

  <!-- net thread -->
  <rect x="748" y="64" width="180" height="230" rx="10" fill="#eef6ff" stroke="#8fb8e8"/>
  <text x="762" y="88" class="col-title">net thread</text>
  <text x="762" y="104" class="col-sub">owns the socket</text>
  <rect x="760" y="122" width="156" height="44" rx="8" class="chip"/>
  <text x="772" y="140" class="box-title">read the socket</text>
  <text x="772" y="156" class="box-sub">waits at most 15 ms</text>
  <rect x="760" y="222" width="156" height="44" rx="8" class="chip"/>
  <text x="772" y="240" class="box-title">write the queue</text>
  <text x="772" y="256" class="box-sub">NOP after 60 s idle</text>

  <!-- host -->
  <line x1="838" y1="296" x2="838" y2="340" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="826" y="322" class="note" text-anchor="end">TCP or TLS (rustls, OS trust store)</text>
  <rect x="748" y="342" width="180" height="56" rx="8" fill="#fff1f0" stroke="#d1242f" stroke-dasharray="5 4"/>
  <text x="762" y="366" class="box-title">IBM i host</text>
  <text x="762" y="384" class="box-sub">telnet 23 · TLS 992</text>

  <text x="32" y="362" class="note">The session never touches a socket (D4): tests feed it recorded host bytes and check the bytes it sends.</text>
  <text x="32" y="382" class="note">The UI and the net thread each lock it briefly; there is no async runtime.</text>
</svg>
