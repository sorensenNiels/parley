<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Parley and Parley SQL: their crates and what they talk to (D36)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .crate-title { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .crate-sub { font-size: 12px; fill: #57606a; }
      .chip { fill: #ffffff; stroke: #d0d7de; }
      .chip-title { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #1f2328; }
      .chip-sub { font-size: 11px; fill: #57606a; }
      .ext { fill: #f6f8fa; stroke: #8c959f; stroke-dasharray: 5 4; }
      .ext-title { font-size: 13px; font-weight: 600; fill: #1f2328; }
      .ext-sub { font-size: 11px; fill: #57606a; }
      .link { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .label { font-size: 11px; fill: #57606a; }
      .column { font-size: 13px; font-weight: 600; fill: #57606a; letter-spacing: 0.06em; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="639" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="42" font-size="20" font-weight="600" fill="#1f2328">Parley and Parley SQL: two programs, apart</text>

  <!-- parley-app -->
  <rect x="32" y="62" width="896" height="96" rx="10" fill="#eef6ff" stroke="#8fb8e8"/>
  <text x="48" y="86" class="crate-title">parley-app</text>
  <text x="140" y="86" class="crate-sub">the parley and parley-sql binaries: thin eframe launchers, the only platform code and the only crate that uses both</text>
  <g>
    <rect x="48" y="98" width="138" height="48" rx="8" class="chip"/>
    <text x="60" y="118" class="chip-title">desktop</text>
    <text x="60" y="135" class="chip-sub">parley's window</text>
    <rect x="194" y="98" width="138" height="48" rx="8" class="chip"/>
    <text x="206" y="118" class="chip-title">macros</text>
    <text x="206" y="135" class="chip-sub">macro files, keychain</text>
    <rect x="340" y="98" width="138" height="48" rx="8" class="chip"/>
    <text x="352" y="118" class="chip-title">sql_start</text>
    <text x="352" y="135" class="chip-sub">SQL… starts parley-sql</text>
    <rect x="486" y="98" width="138" height="48" rx="8" class="chip"/>
    <text x="498" y="118" class="chip-title">sql_main</text>
    <text x="498" y="135" class="chip-sub">parley-sql's window</text>
    <rect x="632" y="98" width="138" height="48" rx="8" class="chip"/>
    <text x="644" y="118" class="chip-title">helpers</text>
    <text x="644" y="135" class="chip-sub">helper jars, file saver</text>
    <rect x="778" y="98" width="134" height="48" rx="8" class="chip"/>
    <text x="790" y="118" class="chip-title">api_keys</text>
    <text x="790" y="135" class="chip-sub">assistant keys</text>
  </g>

  <text x="32" y="180" class="column">PARLEY · THE TERMINAL</text>
  <text x="496" y="180" class="column">PARLEY SQL</text>
  <line x1="248" y1="158" x2="248" y2="190" class="link" marker-end="url(#arrow)"/>
  <line x1="712" y1="158" x2="712" y2="190" class="link" marker-end="url(#arrow)"/>

  <!-- parley-ui-egui -->
  <rect x="32" y="192" width="432" height="152" rx="10" fill="#ecfdf8" stroke="#6cc9b4"/>
  <text x="48" y="216" class="crate-title">parley-ui-egui</text>
  <text x="170" y="216" class="crate-sub">Parley's UI, and the look both share</text>
  <g>
    <rect x="48" y="228" width="128" height="48" rx="8" class="chip"/>
    <text x="58" y="248" class="chip-title">ParleyUi</text>
    <text x="58" y="265" class="chip-sub">frame and actions</text>
    <rect x="184" y="228" width="128" height="48" rx="8" class="chip"/>
    <text x="194" y="248" class="chip-title">terminal</text>
    <text x="194" y="265" class="chip-sub">the 5250 screen</text>
    <rect x="320" y="228" width="128" height="48" rx="8" class="chip"/>
    <text x="330" y="248" class="chip-title">keymap</text>
    <text x="330" y="265" class="chip-sub">PC keys to 5250</text>
    <rect x="48" y="284" width="128" height="48" rx="8" class="chip"/>
    <text x="58" y="304" class="chip-title">sessions</text>
    <text x="58" y="321" class="chip-sub">start screen, dialog</text>
    <rect x="184" y="284" width="128" height="48" rx="8" class="chip"/>
    <text x="194" y="304" class="chip-title">macros</text>
    <text x="194" y="321" class="chip-sub">macro dialogs</text>
    <rect x="320" y="284" width="128" height="48" rx="8" class="chip" stroke="#6cc9b4" stroke-width="2"/>
    <text x="330" y="304" class="chip-title">shared look</text>
    <text x="330" y="321" class="chip-sub">theme, dialog, settings</text>
  </g>

  <!-- parley-sql-ui -->
  <rect x="496" y="192" width="432" height="152" rx="10" fill="#f5f0ff" stroke="#a991e0"/>
  <text x="512" y="216" class="crate-title">parley-sql-ui</text>
  <text x="626" y="216" class="crate-sub">the SQL window and Parley SQL</text>
  <g>
    <rect x="512" y="228" width="128" height="48" rx="8" class="chip"/>
    <text x="522" y="248" class="chip-title">SqlWindow</text>
    <text x="522" y="265" class="chip-sub">sign-on, run, answers</text>
    <rect x="648" y="228" width="128" height="48" rx="8" class="chip"/>
    <text x="658" y="248" class="chip-title">editor</text>
    <text x="658" y="265" class="chip-sub">scripts, completion</text>
    <rect x="784" y="228" width="128" height="48" rx="8" class="chip"/>
    <text x="794" y="248" class="chip-title">results</text>
    <text x="794" y="265" class="chip-sub">grid, charts</text>
    <rect x="512" y="284" width="128" height="48" rx="8" class="chip"/>
    <text x="522" y="304" class="chip-title">browser</text>
    <text x="522" y="321" class="chip-sub">explorer, system</text>
    <rect x="648" y="284" width="128" height="48" rx="8" class="chip"/>
    <text x="658" y="304" class="chip-title">assistant</text>
    <text x="658" y="321" class="chip-sub">the Ask row</text>
    <rect x="784" y="284" width="128" height="48" rx="8" class="chip"/>
    <text x="794" y="304" class="chip-title">app, settings</text>
    <text x="794" y="321" class="chip-sub">Parley SQL itself</text>
  </g>
  <line x1="496" y1="308" x2="466" y2="308" class="link" marker-end="url(#arrow)"/>

  <line x1="248" y1="344" x2="248" y2="370" class="link" marker-end="url(#arrow)"/>
  <line x1="712" y1="344" x2="712" y2="370" class="link" marker-end="url(#arrow)"/>

  <!-- parley-core -->
  <rect x="32" y="372" width="432" height="164" rx="10" fill="#fff8e6" stroke="#e0b44c"/>
  <text x="48" y="396" class="crate-title">parley-core</text>
  <text x="150" y="396" class="crate-sub">the TN5250 engine: sans-I/O, no UI code</text>
  <g>
    <rect x="48" y="408" width="128" height="48" rx="8" class="chip"/>
    <text x="58" y="428" class="chip-title">telnet</text>
    <text x="58" y="445" class="chip-sub">RFC 1205 / 2877</text>
    <rect x="184" y="408" width="128" height="48" rx="8" class="chip"/>
    <text x="194" y="428" class="chip-title">session</text>
    <text x="194" y="445" class="chip-sub">data stream, keys</text>
    <rect x="320" y="408" width="128" height="48" rx="8" class="chip"/>
    <text x="330" y="428" class="chip-title">screen</text>
    <text x="330" y="445" class="chip-sub">buffer, fields</text>
    <rect x="48" y="464" width="128" height="48" rx="8" class="chip" stroke="#e0b44c" stroke-width="2"/>
    <text x="58" y="484" class="chip-title">ebcdic</text>
    <text x="58" y="501" class="chip-sub">code pages</text>
    <rect x="184" y="464" width="128" height="48" rx="8" class="chip"/>
    <text x="194" y="484" class="chip-title">macros</text>
    <text x="194" y="501" class="chip-sub">steps, text format</text>
    <rect x="320" y="464" width="128" height="48" rx="8" class="chip" stroke="#e0b44c" stroke-width="2"/>
    <text x="330" y="484" class="chip-title">net</text>
    <text x="330" y="501" class="chip-sub">TCP or TLS, a thread</text>
  </g>

  <!-- parley-sql-core -->
  <rect x="496" y="372" width="432" height="164" rx="10" fill="#fdf2f8" stroke="#d98bb8"/>
  <text x="512" y="396" class="crate-title">parley-sql-core</text>
  <text x="640" y="396" class="crate-sub">Parley SQL's engine: no UI code</text>
  <g>
    <rect x="512" y="408" width="128" height="48" rx="8" class="chip"/>
    <text x="522" y="428" class="chip-title">hostserver</text>
    <text x="522" y="445" class="chip-sub">port mapper, sign-on</text>
    <rect x="648" y="408" width="128" height="48" rx="8" class="chip"/>
    <text x="658" y="428" class="chip-title">helper</text>
    <text x="658" y="445" class="chip-sub">protocol, runner</text>
    <rect x="784" y="408" width="128" height="48" rx="8" class="chip"/>
    <text x="794" y="428" class="chip-title">text, edit</text>
    <text x="794" y="445" class="chip-sub">split, format, guard</text>
    <rect x="512" y="464" width="128" height="48" rx="8" class="chip"/>
    <text x="522" y="484" class="chip-title">catalog</text>
    <text x="522" y="501" class="chip-sub">completion, services</text>
    <rect x="648" y="464" width="128" height="48" rx="8" class="chip"/>
    <text x="658" y="484" class="chip-title">transfer</text>
    <text x="658" y="501" class="chip-sub">CSV, Excel, upload</text>
    <rect x="784" y="464" width="128" height="48" rx="8" class="chip"/>
    <text x="794" y="484" class="chip-title">assistant</text>
    <text x="794" y="501" class="chip-sub">providers' formats</text>
  </g>
  <line x1="496" y1="488" x2="466" y2="488" class="link" marker-end="url(#arrow)"/>
  <text x="469" y="300" class="label">look</text>
  <text x="471" y="480" class="label">net</text>

  <!-- external systems -->
  <rect x="32" y="572" width="212" height="52" rx="8" fill="#fff1f0" stroke="#d1242f" stroke-dasharray="5 4"/>
  <text x="46" y="593" class="ext-title">IBM i host</text>
  <text x="46" y="611" class="ext-sub">5250: telnet 23 · TLS 992</text>

  <rect x="252" y="572" width="212" height="52" rx="8" class="ext"/>
  <text x="266" y="593" class="ext-title">GitHub releases API</text>
  <text x="266" y="611" class="ext-sub">is a newer version out? (D13)</text>

  <rect x="496" y="572" width="212" height="52" rx="8" fill="#fff1f0" stroke="#d1242f" stroke-dasharray="5 4"/>
  <text x="510" y="593" class="ext-title">Java SQL helper</text>
  <text x="510" y="611" class="ext-sub">JTOpen to the host servers (D20)</text>

  <rect x="716" y="572" width="212" height="52" rx="8" class="ext"/>
  <text x="730" y="593" class="ext-title">AI provider</text>
  <text x="730" y="611" class="ext-sub">the SQL assistant, when on (D27)</text>

  <line x1="384" y1="536" x2="140" y2="570" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="384" y1="536" x2="358" y2="570" class="link" marker-end="url(#arrow)"/>
  <line x1="712" y1="536" x2="604" y2="570" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="848" y1="536" x2="822" y2="570" class="link" marker-end="url(#arrow)"/>
</svg>
