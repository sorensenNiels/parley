<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Parley phases: 0 to 2 done, 3 in progress, more later</title>
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #d0d7de; }
      .phase { font-size: 11px; font-weight: 600; fill: #57606a; letter-spacing: 0.06em; }
      .name { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .detail { font-size: 11.5px; fill: #57606a; }
      .pill-text { font-size: 11px; font-weight: 600; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="229" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="42" font-size="20" font-weight="600" fill="#1f2328">Phases</text>
  <line x1="32" y1="128" x2="928" y2="128" stroke="#d0d7de" stroke-width="2"/>

  <!-- Phase 0 -->
  <rect x="32" y="64" width="166" height="140" rx="10" class="card"/>
  <text x="46" y="88" class="phase">PHASE 0</text>
  <rect x="136" y="75" width="50" height="20" rx="10" fill="#dafbe1"/>
  <text x="161" y="89" class="pill-text" fill="#1a7f37" text-anchor="middle">Done</text>
  <text x="46" y="114" class="name">Development</text>
  <text x="46" y="132" class="name">environment</text>
  <text x="46" y="158" class="detail">Workspace, make verify,</text>
  <text x="46" y="174" class="detail">CI, setup scripts</text>

  <!-- Phase 1 -->
  <rect x="214" y="64" width="166" height="140" rx="10" class="card"/>
  <text x="228" y="88" class="phase">PHASE 1</text>
  <rect x="318" y="75" width="50" height="20" rx="10" fill="#dafbe1"/>
  <text x="343" y="89" class="pill-text" fill="#1a7f37" text-anchor="middle">Done</text>
  <text x="228" y="114" class="name">Connect and</text>
  <text x="228" y="132" class="name">show a screen</text>
  <text x="228" y="158" class="detail">TN5250 over TLS, data</text>
  <text x="228" y="174" class="detail">stream, EBCDIC, keys</text>
  <text x="228" y="190" class="detail">installers</text>

  <!-- Phase 2 -->
  <rect x="396" y="64" width="166" height="140" rx="10" class="card"/>
  <text x="410" y="88" class="phase">PHASE 2</text>
  <rect x="500" y="75" width="50" height="20" rx="10" fill="#dafbe1"/>
  <text x="525" y="89" class="pill-text" fill="#1a7f37" text-anchor="middle">Done</text>
  <text x="410" y="114" class="name">Saved sessions</text>
  <text x="410" y="132" class="name">and the look</text>
  <text x="410" y="158" class="detail">Session dialog,</text>
  <text x="410" y="174" class="detail">keep-alive, settings,</text>
  <text x="410" y="190" class="detail">Tortuga look, updates</text>

  <!-- Phase 3 -->
  <rect x="578" y="64" width="166" height="140" rx="10" fill="#ffffff" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="592" y="88" class="phase">PHASE 3</text>
  <rect x="656" y="75" width="78" height="20" rx="10" fill="#fff8c5"/>
  <text x="695" y="89" class="pill-text" fill="#9a6700" text-anchor="middle">In progress</text>
  <text x="592" y="114" class="name">Keyboard maps</text>
  <text x="592" y="132" class="name">and macros</text>
  <text x="592" y="158" class="detail">Macros, add-ons built</text>
  <text x="592" y="174" class="detail">Auto sign-on removed</text>
  <text x="592" y="190" class="detail">Next: R-KEY-2</text>

  <!-- Later -->
  <rect x="760" y="64" width="168" height="140" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="774" y="88" class="phase">LATER</text>
  <rect x="852" y="75" width="64" height="20" rx="10" fill="#eaeef2"/>
  <text x="884" y="89" class="pill-text" fill="#57606a" text-anchor="middle">Ideas</text>
  <text x="774" y="114" class="name">To be planned</text>
  <text x="774" y="158" class="detail">Printer sessions, SQL,</text>
  <text x="774" y="174" class="detail">tabs, hotspots…</text>
  <text x="774" y="190" class="detail">(IDEAS.md)</text>
</svg>
