# cargo-deny policy: `cargo deny check`
[graph]
all-features = true

[advisories]
# RUSTSEC advisories fail the build; add `ignore = ["RUSTSEC-..."]` entries with a justification.
ignore = [
  # russh pins rsa 0.10.0-rc.18, which already has the constant-time fix; it fails ">= 0.10.0"
  # only because a pre-release sorts first. Remove once russh moves to rsa 0.10.0.
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.10 pre-release already has the constant-time fix" },
  # chrono is unmaintained (2026), not vulnerable. russh uses it too, so it stays until russh moves; our own uses
  # in parley-sql-core and parley-ssh-ui are to move to jiff or time.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no known vulnerability; russh depends on it" },
]

# Only fail on unmaintained crates we depend on directly; transitive ones come from
# eframe/winit and are tracked upstream.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # Mozilla's root certificates (webpki-root-certs, through rustls-platform-verifier).
  "CDLA-Permissive-2.0",
  # Windows clipboard support in eframe (clipboard-win, error-code).
  "BSL-1.0",
  # Fonts bundled with egui (epaint_default_fonts): may be embedded in any app.
  "OFL-1.1",
  "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# Parley and Parley SQL stay apart (D36): only Parley SQL's own crates and the launcher may use
# Parley SQL's engine and UI. Parley's engine and UI (parley-core, parley-ui-egui) never do.
# Parley SSH (D41, R-SSH-1) the same way: only its own UI and the launcher use its crates.
deny = [
  { crate = "parley-sql-core", wrappers = ["parley-sql-ui", "parley-app"] },
  { crate = "parley-sql-ui", wrappers = ["parley-app"] },
  { crate = "parley-ssh-core", wrappers = ["parley-ssh-ui", "parley-app"] },
  { crate = "parley-ssh-ui", wrappers = ["parley-app"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
