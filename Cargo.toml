[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/parley-core"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Niels P. Sørensen <niels.p.sorensen@softdesign.dk>"]

[workspace.dependencies]
parley-core = { path = "crates/parley-core" }
parley-ui-egui = { path = "crates/parley-ui-egui" }
des = "0.8"
sha1 = "0.10"
getrandom = "0.3"

# Bundled fonts, including the emoji fonts that hold symbols the UI may use.
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_plot = "0.38"
# OpenGL (glow) instead of the default wgpu: smaller, faster to build, and works under WSLg.
# `persistence`: the last connection's settings are remembered between runs.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "persistence", "wayland", "x11"] }

# The installed monospace fonts offered for the terminal (R-UI-6): the same libraries egui uses for
# system font fallback.
fontique = { version = "0.11", default-features = false, features = ["system", "fontconfig-dlopen"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }

# Asking GitHub for the latest release (R-UI-11, D13): a blocking client on a thread, with
# rustls (ring) and the operating system's trust store, as for TN5250 over TLS (D6).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
serde_json = "1"

thiserror = "2"
serde = { version = "1", features = ["derive"] }
# TLS for TN5250 over port 992 (R-NET-2): pure Rust with the ring backend; TLS 1.2 is still common on IBM i.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The operating system's certificate store, so certificates from a company CA installed there are trusted.
rustls-platform-verifier = "0.7"
# Automatic sign-on (RFC 4777 section 5): the DES and SHA-1 password substitutes, and the client seed.

# Windows icon and version information in parley.exe (build script).
winresource = { version = "0.1", default-features = false }

# dev / test
egui_kittest = "0.37"

[workspace.lints.rust]
# `deny` (not `forbid`) so a single, justified spot could opt out with `#[expect(unsafe_code)]`.
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are more noise than signal for this project.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# Beyond pedantic: cheap `Arc` clones read differently from deep ones; locks and other
# guards are dropped as soon as possible; no `&mut` that is never used mutably.
clone_on_ref_ptr = "warn"
significant_drop_tightening = "warn"
needless_pass_by_ref_mut = "warn"
derive_partial_eq_without_eq = "warn"
# Library code returns errors; only the binaries print (see CLAUDE.md "Code quality").
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
# Faster incremental builds; dependencies still optimised a bit for a snappy UI.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
