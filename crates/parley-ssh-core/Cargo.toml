[package]
name = "parley-ssh-core"
description = "UI-agnostic engine for Parley SSH: the SSH client, host keys and the xterm terminal emulation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The terminal (D43): the escape-sequence parser only; the screen is Parley SSH's own.
vte = { version = "0.15", default-features = false, features = ["std"] }
unicode-width = "0.2"
# SSH (D42): pure Rust with ring, as rustls uses (D6); RSA keys; zlib compression for R-SSH-27.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
# Only inside the network thread (D42): one current-thread runtime per connection.
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time", "macros", "io-util", "process"] }
# TCP keepalives on the SSH socket (R-SSH-26); tokio uses it already.
socket2 = "0.6"
thiserror.workspace = true
# Hashed known_hosts entries (HMAC-SHA1 of the host name), the versions russh uses.
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
# Passwords wiped from memory when dropped (R-SSH-4); russh uses it too.
zeroize = "1"

[dev-dependencies]
# The in-process SSH server of tests/net.rs runs on its own runtime.
tokio = { version = "1", default-features = false, features = ["rt", "net", "macros", "time"] }
# A stream of the test agent's connections (russh's agent server takes one); russh uses futures already.
futures = "0.3"

[lints]
workspace = true
