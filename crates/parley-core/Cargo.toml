[package]
name = "parley-core"
description = "UI-agnostic TN5250 engine for Parley: telnet negotiation, the 5250 data stream, EBCDIC, the screen model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
des.workspace = true
sha1.workspace = true
getrandom.workspace = true
# Excel files for Download (R-SQL-72, D31); constant memory keeps large downloads small.
rust_xlsxwriter = { version = "0.102", default-features = false, features = ["constant_memory"] }

[dev-dependencies]
# Reads the password without showing it in examples/sqlprobe.rs (R-NET-9).
rpassword = "7"

[lints]
workspace = true
