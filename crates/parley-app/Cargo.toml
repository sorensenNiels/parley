[package]
name = "parley-app"
description = "Parley 5250, Parley SQL and Parley SSH desktop applications: launch the egui UIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
# `cargo run -p parley-app` runs Parley; Parley SQL is `--bin parley-sql` (make run-sql).
default-run = "parley"

[[bin]]
name = "parley"
path = "src/main.rs"

# Parley SQL: the SQL window on its own (R-SQL-45, D26).
[[bin]]
name = "parley-sql"
path = "src/sql_main.rs"

# Parley SSH: the SSH client (R-SSH-1, D41).
[[bin]]
name = "parley-ssh"
path = "src/ssh_main.rs"

[dependencies]
parley-ui-egui.workspace = true
eframe.workspace = true
parley-core.workspace = true
parley-sql-core.workspace = true
parley-sql-ui.workspace = true
parley-ssh-core.workspace = true
parley-ssh-ui.workspace = true
keyring = "4.2"
# The 5250 alarm's beep (R-UI-25, D37): playback only, no decoders. ALSA on Linux.
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# Opens a finished download in the program the system uses for it (R-SQL-101).
opener = { version = "0.9", default-features = false }
# Parley SSH's desktop notifications (R-SSH-46): D-Bus (zbus) on Linux, the system's own on macOS and Windows.
notify-rust = "4"

# File windows for importing and exporting macros (R-KEY-7). GTK on Linux, as Tortuga: the
# xdg-desktop-portal backend fails silently where no portal runs (WSL).
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17", default-features = false }

[dev-dependencies]
# The format eframe stores settings in (its own dependency, the same version), for the test that
# settings saved by an earlier version still load.
ron = "0.12"

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true

# Installers (R-NF-1), built with cargo-packager: `make package` (see docs/RELEASING.md). This config makes the
# Windows .msi and the AppImage, each with all three programs; the .deb files and the macOS apps, one per program
# (R-NF-4, R-NF-5, D56), come from scripts/package-split.sh.
[package.metadata.packager]
product-name = "Parley 5250"
identifier = "dk.softdesign.parley"
description = "A TN5250 terminal for IBM i"
long-description = "Parley 5250 is a fast, modern TN5250 terminal emulator for IBM i: green screens over telnet or TLS, in colour, with familiar keys."
homepage = "https://github.com/sorensenNiels/parley"
category = "Utility"
license-file = "../../LICENSE-MIT"
icons = ["icons/32.png", "icons/64.png", "icons/128.png", "icons/256.png", "icons/512.png", "icons/parley.ico"]
out-dir = "../../target/packages"
binaries = [{ path = "parley", main = true }, { path = "parley-sql", main = false }, { path = "parley-ssh", main = false }]
# The bundled fonts' licence (SIL OFL 1.1) must travel with them; so must the SQL helper, JTOpen and
# their notices (R-SQL-13, D20), built into target/helpers by `make helper` before packaging.
resources = [
  "../parley-ui-egui/assets/fonts/Inter-LICENSE.txt",
  "../parley-ui-egui/assets/fonts/JetBrainsMono-LICENSE.txt",
  "../parley-ui-egui/assets/fonts/IBMPlexMono-LICENSE.txt",
  "../parley-ui-egui/assets/fonts/Phosphor-LICENSE.txt",
  { src = "../../target/helpers/parley-sql.jar", target = "helpers/parley-sql.jar" },
  { src = "../../target/helpers/jt400.jar", target = "helpers/jt400.jar" },
  { src = "../../helpers/sql/NOTICE.txt", target = "helpers/NOTICE.txt" },
  { src = "../../helpers/sql/JTOpen-LICENSE.html", target = "helpers/JTOpen-LICENSE.html" },
]

[package.metadata.packager.appimage]
# Loaded at run time by the window library on X11, and missing on some minimal systems.
libs = ["libxkbcommon-x11.so.0"]

[package.metadata.packager.wix]
# R-NF-3, D55: Parley's own template (from cargo-packager's), where the user chooses which programs to install;
# it puts the components below into its features by id, so they are not in `component-refs`.
template = "windows/main.wxs"
# R-NF-2: the install folder on the system PATH, so `parley`, `parley-sql` and `parley-ssh` work in a new
# terminal (removed again on uninstall), and Parley SQL and Parley SSH in the Start menu beside Parley. Ids from
# the template: INSTALLDIR, ApplicationProgramsFolder. Inline, so no path to resolve.
fragments = ["""<?xml version="1.0" encoding="utf-8"?>
<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
  <Fragment>
    <DirectoryRef Id="INSTALLDIR">
      <Component Id="ParleyOnPath" Guid="6F2B9C1E-4D3A-4B7E-9A51-2C8D7E0F3A64" KeyPath="yes">
        <Environment Id="ParleyPathEntry" Name="PATH" Value="[INSTALLDIR]" Permanent="no" Part="last" Action="set" System="yes"/>
      </Component>
    </DirectoryRef>
    <DirectoryRef Id="ApplicationProgramsFolder">
      <Component Id="ParleySqlShortcut" Guid="B4E1D7A2-8C35-4F69-A0D2-5E7B9C3F1A86">
        <Shortcut Id="ParleySqlStartMenuShortcut" Name="Parley SQL" Description="SQL for IBM i" Target="[INSTALLDIR]parley-sql.exe" WorkingDirectory="INSTALLDIR"/>
        <RegistryValue Root="HKCU" Key="Software\\SoftDesign\\Parley" Name="Parley SQL Shortcut" Type="integer" Value="1" KeyPath="yes"/>
      </Component>
      <Component Id="ParleySshShortcut" Guid="3D8A6F21-9B47-4C5E-8E13-7A2F4B6C9D05">
        <Shortcut Id="ParleySshStartMenuShortcut" Name="Parley SSH" Description="An SSH client" Target="[INSTALLDIR]parley-ssh.exe" WorkingDirectory="INSTALLDIR"/>
        <RegistryValue Root="HKCU" Key="Software\\SoftDesign\\Parley" Name="Parley SSH Shortcut" Type="integer" Value="1" KeyPath="yes"/>
      </Component>
    </DirectoryRef>
  </Fragment>
</Wix>
"""]
