name: Release

# Builds the installers (R-NF-1) on each OS.
# - Push a tag `vX.Y.Z` (matching the version in Cargo.toml; `make release-patch` does it): a GitHub
#   release is published with every installer attached, and marked latest.
# - Run it by hand (Actions → Release → Run workflow): the installers are only kept as
#   artifacts of the run, to try them without releasing.
# See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the packages run on its glibc and anything newer.
          - name: linux-x64
            os: ubuntu-22.04
            formats: deb,appimage
          - name: windows-x64
            os: windows-latest
            formats: wix
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Linux system deps (GTK for the file windows; for the AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libasound2-dev libxkbcommon-x11-0 libfuse2

      - run: rustup show active-toolchain || rustup toolchain install
      - if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      - name: Build
        shell: bash
        run: cargo build -p parley-app --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: The binaries start
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          dir=target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release
          for program in parley parley-sql parley-ssh; do "$dir/$program" --version; done
          # R-SSH-1: the hand-over the AppImage relies on.
          "$dir/parley" --ssh --version

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: The SQL helper and JTOpen (R-SQL-13)
        shell: bash
        run: bash scripts/build-helper.sh target/helpers

      - name: Package
        shell: bash
        env:
          # linuxdeploy is itself an AppImage; this avoids needing FUSE for it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo packager -p parley-app --release -f ${{ matrix.formats }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: parley-${{ matrix.name }}
          path: |
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.msi
            target/packages/*.dmg
          if-no-files-found: error

  release:
    name: GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for the release notes' header (--notes-file below); the packages come from the artifacts.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v8
        with:
          path: downloads
          merge-multiple: true
      - name: Collect the files
        run: mkdir packages && find downloads -type f -exec mv -t packages {} + && ls -l packages
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --latest \
            --title "Parley ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-install.md \
            --generate-notes
      - name: Keep only the newest three releases
        env:
          GH_TOKEN: ${{ github.token }}
        # Keeps the three newest version tags (by version number) and their releases. Every other
        # release, published or draft, is deleted with its files, and so is every other v* tag.
        # `|| true`: grep finds nothing when there is nothing to delete, which is not a failure.
        run: |
          repo=$GITHUB_REPOSITORY
          tags() { gh api "repos/$repo/git/matching-refs/tags/v" --paginate --jq '.[].ref | sub("refs/tags/"; "")'; }
          keep=$(tags | sort -V | tail -n 3)
          echo "Keeping $(echo $keep)"
          gh release list --repo "$repo" --limit 1000 --json tagName --jq '.[].tagName' |
            { grep -vxF "$keep" || true; } |
            while read -r tag; do
              echo "Deleting release $tag"
              gh release delete "$tag" --repo "$repo" --yes
            done
          tags | { grep -vxF "$keep" || true; } |
            while read -r tag; do
              echo "Deleting tag $tag"
              gh api -X DELETE "repos/$repo/git/refs/tags/$tag"
            done
